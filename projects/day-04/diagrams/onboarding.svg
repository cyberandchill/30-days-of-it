<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
 <title>AI-assisted employee onboarding architecture</title><desc>Conceptual application workflow, not a screenshot. Recommendations are advisory; midPoint owns policy, approvals and provisioning.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#315773" stroke-width="2"/></marker></defs>
 <rect width="1400" height="430" fill="#f5f8fb"/>
 <g font-family="sans-serif" fill="#15354c"><text x="45" y="47" font-size="27" font-weight="bold">AI-assisted employee onboarding</text><text x="45" y="80" font-size="18">Advisory recommendations → deterministic authorization → verified application access</text></g>
 <g fill="white" stroke="#315773" stroke-width="2"><rect x="35" y="175" width="185" height="110" rx="12"/><rect x="275" y="120" width="250" height="110" rx="12"/><rect x="590" y="175" width="265" height="130" rx="12"/><rect x="920" y="120" width="180" height="90" rx="12"/><rect x="920" y="260" width="180" height="90" rx="12"/><rect x="1170" y="190" width="195" height="110" rx="12"/></g>
 <g font-family="sans-serif" fill="#15354c" text-anchor="middle"><text x="127" y="213" font-size="21" font-weight="bold">Synthetic HR</text><text x="127" y="243" font-size="16">Validated hire records</text><text x="400" y="150" font-size="21" font-weight="bold">Local AI service</text><text x="400" y="177" font-size="16">scikit-learn peer analysis</text><text x="400" y="201" font-size="16">Ollama explanations</text><text x="722" y="208" font-size="23" font-weight="bold">midPoint IGA</text><text x="722" y="237" font-size="16">Policies • reviewer approval</text><text x="722" y="263" font-size="16">Provisioning • reconciliation</text><text x="1010" y="157" font-size="20" font-weight="bold">Active Directory</text><text x="1010" y="185" font-size="16">Accounts and groups</text><text x="1010" y="295" font-size="21" font-weight="bold">Keycloak</text><text x="1010" y="323" font-size="16">Identities and app roles</text><text x="1267" y="228" font-size="20" font-weight="bold">Protected app</text><text x="1267" y="256" font-size="16">OIDC + PKCE</text><text x="1267" y="280" font-size="16">Allow / deny checks</text></g>
 <g fill="none" stroke="#315773" stroke-width="2.5" marker-end="url(#arrow)"><path d="M220 210L275 175"/><path d="M525 175L590 210"/><path d="M220 265H555V280H590"/><path d="M855 210L920 165"/><path d="M855 270L920 305"/><path d="M1100 305L1170 265"/></g>
 <g font-family="sans-serif" fill="#315773" font-size="16"><text x="300" y="311">HR intake and advisory request</text><text x="1130" y="336">Signed identity claims</text><text x="45" y="397">The LLM cannot grant access, approve requests or override policy. All populations and applications are synthetic lab fixtures.</text></g>
</svg>
