<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-label="Jenkins SAML single sign-on portfolio project"><title>Jenkins SAML Single Sign-On</title><desc>Conceptual browser-mediated SAML authentication between Jenkins and Microsoft Entra, with verified user login and restricted admin access.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:16px;letter-spacing:1px;font-weight:700;fill:#56725e}.title{font-size:43px;font-weight:700;fill:#173024}.sub{font-size:19px;fill:#58705e}.node{font-size:24px;font-weight:700;fill:#20402e;text-anchor:middle}.small{font-size:18px;fill:#586f60;text-anchor:middle}.caption{font-size:18px;fill:#45664e;text-anchor:middle}.body{font-size:22px;fill:#2f4636}.cta{font-size:19px;font-weight:700;fill:#326447}</style><rect width="760" height="850" rx="22" fill="#f9faf7"/><text x="36" y="44" class="eyebrow">CYBERANDCHILL / TECHNICAL PORTFOLIO</text><path d="M36 65H724" stroke="#d8e1d8" stroke-width="2"/><text x="36" y="134" class="title">Jenkins SAML Single Sign-On</text><text x="36" y="175" class="sub">Microsoft Entra · Jenkins · SAML 2.0</text><rect x="29" y="217" width="702" height="430" rx="20" fill="#eaf1ea"/><text x="48" y="251" class="eyebrow">HOW AUTHENTICATION WORKS</text><rect x="228" y="277" width="304" height="92" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="380" y="317" class="node">Microsoft Entra</text><text x="380" y="344" class="small">Identity provider</text><rect x="42" y="501" width="298" height="97" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="191" y="541" class="node">User's browser</text><text x="191" y="568" class="small">Carries SAML response</text><rect x="420" y="501" width="298" height="97" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="569" y="541" class="node">Jenkins</text><text x="569" y="568" class="small">Checks signed assertion</text><path d="M293 369L205 498 M200 480L205 498L223 491" fill="none" stroke="#5b7e63" stroke-width="4"/><path d="M340 549H418 M403 541L418 549L403 557" fill="none" stroke="#5b7e63" stroke-width="4"/><path d="M544 500L462 369 M464 387L462 369L480 379" fill="none" stroke="#83a48a" stroke-width="3" stroke-dasharray="7 8"/><text x="113" y="424" class="caption">Sign in</text><text x="386" y="528" class="caption">SAML</text><text x="598" y="422" class="caption">Redirect</text><text x="36" y="692" class="eyebrow">WHAT I BUILT</text><text x="36" y="729" class="body">Enterprise SSO for Jenkins using an existing</text><text x="36" y="760" class="body">Entra identity with restricted user access.</text><path d="M36 789H724" stroke="#d8e1d8" stroke-width="2"/><text x="36" y="823" class="cta">Architecture · GUI walkthrough · Results</text><text x="724" y="823" text-anchor="end" class="cta">VIEW PROJECT →</text></svg>